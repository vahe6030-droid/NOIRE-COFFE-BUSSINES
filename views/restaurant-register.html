<!doctype html><html lang="ru"><head>
    <script src="/js/tenant-context.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Restaurant SaaS</title><link rel="stylesheet" href="/css/auth.css"></head><body class="noire-auth"><main class="auth-shell"><section class="auth-card"><div style="display:flex;justify-content:flex-end;gap:6px"><button type="button" data-lang="ru">RU</button><button type="button" data-lang="en">EN</button><button type="button" data-lang="hy">HY</button></div><a href="/" class="auth-brand"><b>RESTAURANT</b><span>SAAS PLATFORM</span></a><h1 data-t="title">Создать ресторан</h1><p data-t="lead">Создайте независимый сайт и кабинет ресторана.</p><form id="restaurantForm"><label><span data-t="restaurant">Название ресторана</span><input name="restaurantName" required minlength="2"></label><label><span data-t="slug">Адрес сайта (slug)</span><input name="slug" placeholder="my-restaurant"></label><label><span data-t="owner">Имя владельца</span><input name="ownerName" required minlength="2"></label><label>Email<input name="email" type="email" required></label><label><span data-t="phone">Телефон</span><input name="phone" type="tel"></label><label><span data-t="password">Пароль</span><div class="password-field"><input id="password" name="password" type="password" required minlength="8"><button type="button" class="password-toggle" data-eye="password" aria-label="Show">👁</button></div></label><label><span data-t="repeat">Повторите пароль</span><div class="password-field"><input id="confirmPassword" name="confirmPassword" type="password" required minlength="8"><button type="button" class="password-toggle" data-eye="confirmPassword" aria-label="Show">👁</button></div></label><button type="submit" data-t="create">Создать ресторан</button><p id="message" role="alert"></p></form></section></main><script src="/js/restaurant-register.js"></script></body></html>
