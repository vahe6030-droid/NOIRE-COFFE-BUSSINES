<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Заказ домой — NOIRÉ</title>

    <link
        rel="stylesheet"
        href="/css/style.css"
    >

<style>
.payment-options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:8px}
.payment-option{position:relative;display:block;cursor:pointer}
.payment-option input{position:absolute;opacity:0;pointer-events:none}
.payment-card{min-height:86px;border:1px solid rgba(201,154,91,.25);border-radius:16px;background:linear-gradient(145deg,rgba(255,255,255,.045),rgba(255,255,255,.015));padding:16px;display:flex;align-items:center;gap:13px;transition:.2s ease;box-shadow:inset 0 0 0 1px transparent}
.payment-card:hover{border-color:rgba(201,154,91,.55);transform:translateY(-1px)}
.payment-option input:checked + .payment-card{border-color:#d4aa6d;box-shadow:inset 0 0 0 1px #d4aa6d,0 8px 28px rgba(0,0,0,.18);background:linear-gradient(145deg,rgba(212,170,109,.16),rgba(255,255,255,.035))}
.payment-icon{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;border:1px solid rgba(201,154,91,.35);color:#e2bd82;font-size:20px;flex:none}
.payment-card strong{display:block;color:#f4eee7;font-size:14px}.payment-card small{display:block;color:#9e9389;margin-top:3px;font-size:11px}
@media(max-width:520px){.payment-options{grid-template-columns:1fr}.payment-card{min-height:76px}}
</style>

</head>

<body>

<header class="header scrolled">

    <nav class="navbar">

        <a href="/" class="logo">
            <span class="logo-main">
                NOIRÉ
            </span>

            <span class="logo-sub">
                COFFEE & KITCHEN
            </span>
        </a>

        <button id="mobileToggle" class="mobile-toggle" aria-label="Меню" aria-expanded="false">☰</button>
        <div class="nav-menu">

            <a href="/" class="nav-link">
                Главная
            </a>

            <a href="/menu.html" class="nav-link">
                Меню
            </a>

            <a href="/gallery.html" class="nav-link">Gallery</a>
                <a href="/about.html" class="nav-link">
                О нас
            </a>

            <a href="/contacts.html" class="nav-link">
                Контакты
            </a>

            <a href="/reservation.html" class="nav-link">
                Бронь
            </a>

            <a
                href="/checkout.html"
                class="nav-link active"
            >
                Доставка
            </a>

        </div>

    </nav>

</header>

<main class="section form-page">

    <div class="section-heading">

        <div>

            <div class="section-kicker">
                DELIVERY
            </div>

            <h1 class="section-title">
                Заказ домой
            </h1>

        </div>

        <button
            class="outline-button"
            onclick="repeatLastOrder()"
        >
            ↻ Повторить заказ
        </button>

    </div>

    <div class="form-card">

        <div
            id="checkoutSummary"
            style="
                margin-bottom:30px;
            "
        ></div>

        <form id="checkoutForm">

            <div class="form-grid">

                <div class="form-group">

                    <label>
                        Имя
                    </label>

                    <input
                        class="form-control"
                        name="name"
                        required
                    >

                </div>

                <div class="form-group">

                    <label>
                        Телефон
                    </label>

                    <input
                        class="form-control"
                        name="phone"
                        required
                    >

                </div>

                <div class="form-group">
                    <label>Email</label>
                    <input class="form-control" name="email" type="email" autocomplete="email">
                </div>

                <div class="form-group full">

                    <label>
                        Адрес
                    </label>

                    <input
                        class="form-control"
                        name="address"
                        required
                        placeholder="Улица, дом, квартира"
                    >

                </div>

                <div class="form-group">

                    <label>
                        Подъезд
                    </label>

                    <input
                        class="form-control"
                        name="entrance"
                    >

                </div>

                <div class="form-group">

                    <label>
                        Этаж
                    </label>

                    <input
                        class="form-control"
                        name="floor"
                    >

                </div>

                <div class="form-group full">
                    <label>Оплата</label>
                    <div class="payment-options" role="radiogroup" aria-label="Способ оплаты">
                        <label class="payment-option">
                            <input type="radio" name="payment" value="card" checked>
                            <span class="payment-card">
                                <span class="payment-icon" aria-hidden="true">▣</span>
                                <span><strong>Картой курьеру</strong><small>Оплата при получении</small></span>
                            </span>
                        </label>
                        <label class="payment-option">
                            <input type="radio" name="payment" value="cash">
                            <span class="payment-card">
                                <span class="payment-icon" aria-hidden="true">◈</span>
                                <span><strong>Наличными</strong><small>Способ оплаты для заказа</small></span>
                            </span>
                        </label>
                    </div>
                </div>

                <div class="form-group">

                    <label>
                        Время
                    </label>

                    <select
                        class="form-control"
                        name="deliveryTime"
                    >

                       <option value="Как можно скорее">Как можно скорее</option>
<option value="Через 30 минут">Через 30 минут</option>
<option value="Через 60 минут">Через 60 минут</option>
                    </select>

                </div>

                <div class="form-group full">

                    <label>
                        Комментарий
                    </label>

                    <textarea
                        class="form-control"
                        name="comment"
                        placeholder="Комментарий для курьера"
                    ></textarea>

                </div>

                <div class="form-group full">

                    <button
                        class="gold-button"
                        type="submit"
                        style="
                            width:100%;
                            padding:18px;
                        "
                    >
                        ОФОРМИТЬ ЗАКАЗ
                    </button>

                </div>

            </div>

        </form>

    </div>

</main>

<script src="/js/site-language.js"></script>
<script src="/js/menu-translations.js"></script>
<script src="/js/cart.js"></script>
<script src="/js/app.js"></script>
<script>

    const checkoutT = (key, vars = {}) =>
    window.noireT
        ? window.noireT(key, vars)
        : key.replace(
            /\{(\w+)\}/g,
            (_, name) => vars[name] ?? `{${name}}`
        );

document.addEventListener(
    "DOMContentLoaded",
    () => {

        const cart = getCart();

        const summary =
            document.querySelector(
                "#checkoutSummary"
            );

        if (!cart.length) {

           if (!cart.length) {

    summary.innerHTML = `
        <div style="
            text-align:center;
            padding:40px;
            color:#9e9389;
        ">

            <div style="
                font-size:55px;
            ">
                🛒
            </div>

            <h2 style="
                margin-top:15px;
                color:white;
            ">
                ${checkoutT("Корзина пуста")}
            </h2>

            <a
                href="/menu.html"
                class="gold-button"
                style="
                    display:inline-block;
                    margin-top:20px;
                "
            >
                ${checkoutT("ОТКРЫТЬ МЕНЮ")}
            </a>

        </div>
    `;

    return;
}

        summary.innerHTML = `

    <h3 style="
        font-family:'Playfair Display',serif;
        font-size:28px;
        margin-bottom:15px;
    ">
        ${checkoutT("Ваш заказ")}
    </h3>



            ${cart.map(item => `
                <div style="
                    display:flex;
                    justify-content:space-between;
                    padding:12px 0;
                    border-bottom:1px solid var(--border);
                ">

                    <span>
                        ${typeof escHtml==='function'?escHtml(item.name):String(item.name).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","\'":"&#039;"}[c]))}
                        × ${item.quantity}
                    </span>

                    <strong style="
                        color:var(--gold-light);
                    ">
                        ${formatMoney(
                            item.price *
                            item.quantity
                        )}
                    </strong>

                </div>
            `).join("")}

            <div style="
                display:flex;
                justify-content:space-between;
                margin-top:20px;
                font-size:22px;
            ">

               <strong>
    ${checkoutT("Итого")}
</strong>

                <strong style="
                    color:var(--gold-light);
                ">
                    ${formatMoney(cartTotal())}
                </strong>

            </div>
        `;
        }
});

(async function fillCustomerProfile(){
    
    try{const r=await fetch('/api/auth/me',{credentials:'same-origin'}); if(!r.ok)return; const d=await r.json(); const u=d.user||{}; const f=document.querySelector('#checkoutForm'); if(!f)return;
      const name=[u.firstName,u.middleName,u.lastName].filter(Boolean).join(' ').trim()||u.name||'';
      [['name',name],['phone',u.phone||''],['address',u.address||''],['entrance',u.entrance||''],['floor',u.floor||'']].forEach(([n,v])=>{const el=f.elements[n]; if(el&&v)el.value=v;});
      if(f.elements.email&&!f.elements.email.value&&u.email)f.elements.email.value=u.email;
    }catch(e){}
})();

document.querySelector(
    "#checkoutForm"
).addEventListener(
    "submit",
    async event => {

        event.preventDefault();

        const cart = getCart();

        if (!cart.length) {
           showToast(
    checkoutT("Сначала добавьте блюда")
);
            return;
        }

        const form = event.target;
        const submitButton=form.querySelector('button[type=submit]');
        if(submitButton?.disabled) return;
if (submitButton) {
    submitButton.disabled = true;
    submitButton.dataset.originalText = submitButton.textContent;
    submitButton.textContent = checkoutT("Оформляем…");
}
        const idempotencyKey=(crypto.randomUUID?crypto.randomUUID():`${Date.now()}-${Math.random()}`);

        const data =
            Object.fromEntries(
                new FormData(form)
            );

        const customer = {
            name: data.name,
            phone: data.phone,
            email: data.email,
            address: data.address,
            entrance: data.entrance,
            floor: data.floor,
            payment: data.payment,
            deliveryTime: data.deliveryTime,
            comment: data.comment,
            budget: Number(data.budget || 0)
        };

        
       let response;
let result;

try {
    response = await fetch(
        "/api/orders",
        {
            method: "POST",
            credentials: "same-origin",
            headers: {
                "Content-Type": "application/json",
                "Idempotency-Key": idempotencyKey
            },
            body: JSON.stringify({
                customer,
                items: cart,
                orderType: "delivery",
                total: cartTotal(),
                budget: Number(data.budget || 0)
            })
        }
    );

    const contentType =
        response.headers.get("content-type") || "";

    if (!contentType.includes("application/json")) {
        throw new Error(
            response.ok
                ? "Сервер вернул некорректный ответ."
                : `Ошибка сервера (${response.status}).`
        );
    }

    result = await response.json();

} catch (err) {
    if (submitButton) {
        submitButton.disabled = false;
        submitButton.textContent =
            submitButton.dataset.originalText ||
            checkoutT("ОФОРМИТЬ ЗАКАЗ");
    }

   showToast(
    err?.message ||
    checkoutT(
        "Не удалось оформить заказ. Проверьте соединение и повторите попытку."
    )
);
    return;
}

showToast(
    result?.message ||
    `${checkoutT("Не удалось оформить заказ")}${
        response?.status
            ? ` (${response.status})`
            : ""
    }.`
);
    if (submitButton) {
        submitButton.disabled = false;
        submitButton.textContent =
            submitButton.dataset.originalText ||
            checkoutT("ОФОРМИТЬ ЗАКАЗ");
    }

    return;
});
        localStorage.setItem(
            "noireLastOrder",
            JSON.stringify({
                orderId:
                    result.order.id,

                items: cart
            })
        );

        localStorage.removeItem(
            "noireCart"
        );

        document.querySelector(
            ".form-card"
        ).innerHTML = `

            <div style="
                text-align:center;
                padding:80px 20px;
            ">

                <div style="
                    font-size:80px;
                    color:#c99a5b;
                ">
                    ✓
                </div>

                <h1 style="
                    font-family:'Playfair Display',serif;
                    font-size:55px;
                    margin-top:15px;
                ">
                   ${checkoutT("Заказ принят")}
                </h1>

                <p style="
                    color:#9e9389;
                    margin-top:15px;
                ">
                   ${checkoutT("Номер заказа:")}
                    <strong>
                        #${result.order.number}
                    </strong>
                </p>

                <p style="
                    color:#9e9389;
                    margin-top:8px;
                ">
                    ${checkoutT("Мы уже начали его готовить.")}
                </p>

                <a
                    href="/"
                    class="gold-button"
                    style="
                        display:inline-block;
                        margin-top:30px;
                    "
                >
                    ${checkoutT("НА ГЛАВНУЮ")}
                </a>

            </div>
        `;
        


</script>


</body>
</html>
