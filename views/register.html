<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NOIRÉ — Регистрация</title><link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/auth.css"></head><body class="noire-auth"><main class="auth-shell"><a class="auth-brand" href="/"><b>NOIRÉ</b><span>COFFEE & KITCHEN</span></a><section class="auth-card"><span class="admin-eyebrow">NOIRÉ MEMBERS</span><h1>Создать аккаунт</h1><p>Сохраняйте адреса, заказы и историю посещений в одном месте.</p><form id="registerForm"><div class="register-name-grid"><label>Имя<input name="firstName" required autocomplete="given-name"></label><label>Фамилия<input name="lastName" required autocomplete="family-name"></label><label class="full">Отчество<input name="middleName" autocomplete="additional-name"></label></div><label>Email<input name="email" type="email" autocomplete="email"></label><label>Телефон<input name="phone" type="tel" autocomplete="tel"></label><label>Пароль<div class="password-field"><input name="password" type="password" minlength="6" required autocomplete="new-password"><button type="button" class="password-toggle" aria-label="Показать пароль" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12s3.5-5 9.5-5 9.5 5 9.5 5-3.5 5-9.5 5-9.5-5-9.5-5Z"/><circle cx="12" cy="12" r="2.5"/></svg></button></div></label><button>Зарегистрироваться</button><div id="error"></div></form><a class="auth-link" href="/login.html">У меня уже есть аккаунт</a></section></main><script src="/js/auth.js"></script><script src="/js/site-language.js"></script>
</body></html>
