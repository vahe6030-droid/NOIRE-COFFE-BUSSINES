<!doctype html><html lang="ru"><head>
    <script src="/js/tenant-context.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SaaS Control</title><link rel="stylesheet" href="/css/auth.css"><style>
:root{color-scheme:dark}body{min-height:100vh}.saas{width:min(1220px,94vw);margin:30px auto}.bar,.card{background:#111;border:1px solid #2b2926;border-radius:18px;padding:20px;margin-bottom:16px}.bar{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}.langs button,.actions button{margin-left:7px}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:16px 0}.stat{background:#111;border:1px solid #2b2926;border-radius:16px;padding:18px}.stat strong{font-size:28px;display:block}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}.muted{opacity:.65}.slug{font-family:monospace}.hidden{display:none!important}button,a.btn,select{border:1px solid #5b4b37;background:#1b1712;color:#eee;padding:10px 14px;border-radius:10px;text-decoration:none;cursor:pointer}input{width:100%;box-sizing:border-box;margin:6px 0 12px;padding:11px;border-radius:9px}.password-wrap{position:relative;display:block}.password-wrap input{padding-right:46px}.password-eye{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:34px;height:34px;margin:0;padding:0;border:0;background:transparent;color:inherit;opacity:.58;display:grid;place-items:center;cursor:pointer}.password-eye:hover,.password-eye:focus-visible{opacity:1}.password-eye svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7}.danger{border-color:#70403d!important}.meta{display:grid;gap:5px;margin:12px 0}.subscription{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.subscription select{flex:1;min-width:120px}@media(max-width:800px){.stats{grid-template-columns:repeat(2,1fr)}}
</style></head><body class="noire-auth"><main class="saas"><section class="bar"><div><b data-t="title">SaaS управление</b><div class="muted" data-t="subtitle">Центр управления платформой</div></div><div class="langs"><button data-lang="ru">RU</button><button data-lang="en">EN</button><button data-lang="hy">HY</button></div></section>
<section id="login" class="card"><h1 data-t="login">Вход Super Admin</h1><form id="loginForm"><label><span data-t="username">Логин</span><input name="username" required autocomplete="username"></label><label><span data-t="password">Пароль</span><span class="password-wrap"><input id="saasPassword" name="password" type="password" autocomplete="current-password" required><button id="togglePassword" class="password-eye" type="button" aria-label="Показать пароль"><svg viewBox="0 0 24 24"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"/><circle cx="12" cy="12" r="2.8"/></svg></button></span></label><button data-t="signIn">Войти</button><p id="msg"></p></form></section>
<section id="panel" class="hidden"><div class="bar"><div><b data-t="dashboard">Dashboard</b><div class="muted" data-t="dashboardLead">Рестораны, владельцы и подписки</div></div><div><a class="btn" href="/restaurant-register" data-t="create">+ Создать ресторан</a><button id="logout" data-t="logout">Выйти</button></div></div>
<div class="stats"><div class="stat"><strong id="sRestaurants">0</strong><span data-t="restaurants">Рестораны</span></div><div class="stat"><strong id="sActive">0</strong><span data-t="active">Активны</span></div><div class="stat"><strong id="sSuspended">0</strong><span data-t="suspended">Приостановлены</span></div><div class="stat"><strong id="sTrials">0</strong><span data-t="trials">Trial</span></div><div class="stat"><strong id="sPaid">0</strong><span data-t="paid">Активные подписки</span></div></div>
<div class="bar"><div><b data-t="restaurants">Рестораны</b> · <span id="count">0</span></div></div><div id="grid" class="grid"></div></section></main><script src="/js/saas-admin.js"></script></body></html>
